# Publishing the npm package. One implementation, two callers:
#
#   - the `release:` event (a GitHub Release created by hand) — the manual escape
#     hatch, publishing whatever tag the release names;
#   - `workflow_call` from `release.yml`, which bumps the version on `main`, tags
#     it and creates the Release in that same run. The call is explicit because a
#     Release created with the workflow's own `GITHUB_TOKEN` does not start
#     another workflow run — the `release:` trigger would never fire for it.
#
# `package.json` carries the published version; the tag only selects the commit.
# The two are checked against each other and the run fails when they disagree,
# which is how the `v0.2.1` release once published `0.2.0` from a manifest that
# had never been bumped.
#
# `npm publish` is the only step that talks to the registry — the npm CLI is what
# performs the trusted-publishing exchange, and pnpm 10 implements none of it — preceded
# by two gates: `pnpm check` (typecheck, build, tests under coverage, resource
# audit) and a look inside the tarball itself. The tarball gate exists because
# the gate that builds and the job that publishes are not the same checkout
# unless something says so: `lib/` is git-ignored, so a publish run without its
# build step ships a package whose `main` does not exist.

name: Node.js Package

on:
  release:
    types: [created]
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish; empty means the release tag, or the triggering ref
        required: false
        default: ''
        type: string
  # The third entry point exists because a publish that died after its tag and
  # Release were cut has no other replay: the `release:` trigger stays silent for
  # a Release the release job created with its own `GITHUB_TOKEN`, and a fresh
  # push would either ask for a version the manifest already carries or cut a
  # second tag for a publish that never landed. It also lets the workflow be run
  # on its own while a trusted-publisher configuration is being settled.
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag to publish; empty publishes the manifest's version unverified against a tag
        required: false
        default: ''
        type: string

# Trusted publishing: the job mints an OIDC token and exchanges it with npm for a
# short-lived publish credential, so no long-lived registry secret exists to
# expire. `id-token: write` is what makes the token available, and a
# `NODE_AUTH_TOKEN` in the environment would take precedence over the exchange —
# the stale one this repository carried turned a dead credential into a masked
# `404` on the PUT, indistinguishable from a permission problem.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04  # pinned: the ubuntu-latest label migrates to Ubuntu 26 on 2026-10-19 — move this, and re-run the gate, deliberately
    # Mirrors the checkout's `ref:` below for the shell steps; the checkout
    # cannot read `env`, so the expression is repeated there.
    env:
      REF: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}
          # The version comes from `package.json`, not from git: no history is
          # needed, and the ref above is the tag or the release's tag name.
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # 24 for npm 11: the CLI that exchanges the OIDC token (needs >= 11.5.1).
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The manifest and the tag carry one version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$REF" == refs/tags/* || "$REF" == v* ]]; then
            tag="${REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match package.json $version — bump the manifest, do not retag"
              exit 1
            fi
            echo "publishing $version from tag $tag"
          else
            echo "::warning::ref $REF is not a tag; publishing package.json's $version unverified against a tag"
          fi

      - name: Gate — typecheck, build, coverage, resource audit
        run: pnpm check

      - name: The tarball ships every path package.json promises
        run: |
          set -euo pipefail
          pnpm pack > /dev/null
          tarball="$(ls -t ./*.tgz | head -1)"
          echo "inspecting $tarball"
          contents="$(tar tzf "$tarball")"
          for entry in package/lib/index.js package/lib/client.js package/cordis.patch.yml package/locale/en.json; do
            if ! grep -qx "$entry" <<< "$contents"; then
              echo "::error::$tarball is missing $entry"
              exit 1
            fi
          done
          echo "$tarball carries $(wc -l <<< "$contents") entries"

      # A rejected trusted publisher, a missing one, and one that allows staging
      # but not publishing all reach the PUT as the same masked `404`, and npm's
      # own troubleshooting lists no order between them. So ask the registry the
      # question the CLI asks — the token exchange, with npm's audience — and
      # print the claims it matched the answer against: a 2xx here with a still
      # failing publish narrows the cause to the configuration's allowed actions,
      # while a 401/404 names the mismatch while the values it should have named
      # are still on screen. The exchange response is a credential and is never
      # printed; the claims are not.
      - name: Trusted publishing — the claims this run offers the registry
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::no OIDC request URL in the environment — the job lacks id-token: write"
            exit 1
          fi
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"
          claims="$(node -e 'process.stdout.write(Buffer.from(process.argv[1].split(".")[1], "base64url").toString())' "$token")"
          jq '{sub, repository, workflow_ref, job_workflow_ref, ref, environment}' <<< "$claims"
          file="$(jq -r '.job_workflow_ref // ""' <<< "$claims" | sed -E 's#.*/\.github/workflows/##; s/@.*//')"
          echo "::notice::this run offers repository=${{ github.repository }} workflow-file=${file:-unknown} environment=$(jq -r '.environment // "none"' <<< "$claims")"
          status="$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-project-mcp" \
            -H "Authorization: Bearer $token")"
          if [[ "$status" == 2* ]]; then
            echo "::notice::the registry exchanged this run's token (HTTP $status), so the configured trusted publisher matches these claims — a publish that still fails is the configuration's allowed actions: add 'npm publish' (npm trust github dsh-project-mcp --file ${file:-npm-publish.yml} --repo ${{ github.repository }} --allow-publish)"
            exit 0
          fi
          echo "::error::the registry refused this run's token exchange (HTTP $status) — register these exact values, or: npm trust github dsh-project-mcp --file ${file:-npm-publish.yml} --repo ${{ github.repository }} --allow-publish"
          cat "$RUNNER_TEMP/exchange.json" 2> /dev/null || true
          exit 1

      # No `NODE_AUTH_TOKEN`: the credential comes from the `id-token: write`
      # above, exchanged with the trusted publisher registered for this workflow
      # on npmjs.com. The publisher is the npm CLI, not `pnpm publish`: the pnpm
      # 10 line carries no trusted-publishing code at all, so it would send the
      # PUT unauthenticated and the registry would mask that as a 404.
      #
      # The refusals below are the ones this pipeline has actually met. Each is
      # terse and two of them look alike — a masked `404` for "no credential", a
      # `403` naming an action, a `409` naming a version — so each one prints the
      # fix that applies before the step ends, instead of leaving the next person
      # to rediscover which of the several requirements is wrong.
      - name: Publish to npm
        run: |
          set -uo pipefail
          log="$(mktemp)"
          if npm publish 2>&1 | tee "$log"; then
            exit 0
          fi
          code="${PIPESTATUS[0]}"
          if grep -q 'OIDC permission denied for this action' "$log"; then
            echo "::error::the trusted publisher for this package does not allow npm publish — enable that action on npmjs.com, or with the npm 12 CLI (npm trust github <pkg> --file npm-publish.yml --allow-publish); staging instead is a deliberate choice, not this pipeline's"
          elif grep -q 'Cannot publish over previously staged version' "$log"; then
            echo "::error::this version is already staged on npm — approve or reject it before re-running this release (npm 12: npm stage list <pkg>, then npm stage approve|reject <stage-id>; the npm 11 line has no stage command at all, and the web UI shows the same list)"
          elif grep -qE 'E404|Not Found - PUT' "$log"; then
            echo "::error::the registry answered 404 on the PUT, which is what an unauthenticated or unauthorized request looks like — check for a stale NODE_AUTH_TOKEN and that the trusted publisher names this repository, the workflow file npm-publish.yml and no environment"
          fi
          exit "$code"

      - name: The registry serves the version this run published
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # The registry's read side can trail the write by a moment, so a miss
          # is retried rather than reported: a false alarm here, after a publish
          # that did happen, would send someone looking for a package that exists.
          for attempt in 1 2 3 4 5; do
            published="$(npm view "dsh-project-mcp@$version" version 2> /dev/null || true)"
            if [[ "$published" == "$version" ]]; then
              echo "npm serves dsh-project-mcp@$published"
              exit 0
            fi
            echo "attempt $attempt: npm answers '${published}' for dsh-project-mcp@$version"
            sleep 5
          done
          echo "::error::npm does not serve dsh-project-mcp@$version after a successful publish"
          exit 1
